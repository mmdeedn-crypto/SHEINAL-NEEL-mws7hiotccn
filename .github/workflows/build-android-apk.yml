name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'assets/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: 12266719

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/assets@3.0.5 @supabase/supabase-js@2.45.4
          mkdir -p www/vendor
          cp index.html www/index.html
          cp manifest.webmanifest sw.js icon.svg www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js#./vendor/supabase.min.js#' www/index.html
          sed -i 's/window.APP_BUILD=0/window.APP_BUILD=${{ github.run_number }}/' www/index.html
          npx cap init "شي آن النيل" "com.sheinalneel.shop" --web-dir=www
          npx cap add android
          npx cap sync android
          mkdir -p assets
          curl -L --fail --retry 3 'https://i.pinimg.com/736x/0a/44/0a/0a440aff794433c1f9074f6aa301c7dd.jpg' -o assets/icon.png
          sudo apt-get install -y imagemagick
          convert assets/icon.png -resize 1024x1024! assets/logo.png
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#a8b58a' --splashBackgroundColor '#a8b58a'


      - name: Add native in-app APK updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main_files = list(Path("android/app/src/main").rglob("MainActivity.java"))
          if len(main_files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(main_files)}")
          main = main_files[0]
          source = main.read_text()
          package_line = next((line for line in source.splitlines() if line.startswith("package ")), None)
          if not package_line:
              raise SystemExit("Could not determine MainActivity package")
          package = package_line.split()[1].rstrip(";")
          if "AppUpdaterPlugin" not in source:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;" + chr(10) + "import " + package + ".AppUpdaterPlugin;"
              )
              old_decl = "public class MainActivity extends BridgeActivity {"
              new_decl = old_decl + chr(10) + """    @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }"""
              if old_decl not in source:
                  raise SystemExit("Could not patch MainActivity class declaration")
              source = source.replace(old_decl, new_decl, 1)
              main.write_text(source)
          plugin = """package PACKAGE_NAME;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              @PluginMethod
              public void installUpdate(PluginCall call) {
                  String address = call.getString("url");
                  if (address == null || !address.startsWith("https://")) {
                      call.reject("رابط التحديث غير صالح");
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 26 && !getContext().getPackageManager().canRequestPackageInstalls()) {
                      try {
                          Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName()));
                          getActivity().startActivity(settings);
                          JSObject out = new JSObject();
                          out.put("needsPermission", true);
                          call.resolve(out);
                      } catch (Exception e) {
                          call.reject("تعذر فتح إعداد السماح بالتثبيت", e);
                      }
                      return;
                  }
                  executor.execute(() -> {
                      HttpURLConnection connection = null;
                      try {
                          URL url = new URL(address);
                          connection = (HttpURLConnection) url.openConnection();
                          connection.setConnectTimeout(20000);
                          connection.setReadTimeout(60000);
                          connection.setInstanceFollowRedirects(true);
                          connection.setRequestProperty("User-Agent", "SheinAlNeel-AppUpdater");
                          int status = connection.getResponseCode();
                          if (status < 200 || status >= 300) throw new Exception("فشل تنزيل APK: HTTP " + status);
                          long total = connection.getContentLengthLong();
                          long done = 0;
                          File dir = new File(getContext().getCacheDir(), "updates");
                          if (!dir.exists() && !dir.mkdirs()) throw new Exception("تعذر إنشاء مجلد التحديث");
                          File apk = new File(dir, "shein-al-neel-update.apk");
                          try (InputStream in = connection.getInputStream(); FileOutputStream out = new FileOutputStream(apk)) {
                              byte[] buffer = new byte[65536];
                              int count;
                              while ((count = in.read(buffer)) != -1) {
                                  out.write(buffer, 0, count);
                                  done += count;
                                  if (total > 0) {
                                      JSObject progress = new JSObject();
                                      progress.put("percent", Math.min(100, (int)(done * 100 / total)));
                                      notifyListeners("updateProgress", progress);
                                  }
                              }
                              out.flush();
                          }
                          if (!apk.isFile() || apk.length() < 1024) throw new Exception("ملف APK الذي تم تنزيله غير مكتمل");
                          Uri uri = FileProvider.getUriForFile(getContext(),
                              getContext().getPackageName() + ".fileprovider", apk);
                          Intent install = new Intent(Intent.ACTION_VIEW);
                          install.setDataAndType(uri, "application/vnd.android.package-archive");
                          install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(install);
                          JSObject result = new JSObject();
                          result.put("started", true);
                          call.resolve(result);
                      } catch (Exception e) {
                          call.reject("تعذر تنزيل أو فتح التحديث: " + e.getMessage(), e);
                      } finally {
                          if (connection != null) connection.disconnect();
                      }
                  });
              }
          }
          """.replace("PACKAGE_NAME", package)
          java_dir = main.parent
          (java_dir / "AppUpdaterPlugin.java").write_text(plugin)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in xml:
              xml = xml.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' + chr(10) + '    <application', 1)
          if "androidx.core.content.FileProvider" not in xml:
              provider = """
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              """
              xml = xml.replace("</application>", provider + chr(10) + "    </application>", 1)
          manifest.write_text(xml)
          res = Path("android/app/src/main/res/xml")
          res.mkdir(parents=True, exist_ok=True)
          (res / "file_paths.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="apk_updates" path="updates/" />
          </paths>
          """)
          print("Native AppUpdater plugin configured for " + package)
          PY

      - name: Configure permanent APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + __import__('os').environ['BUILD_NUMBER'], s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.' + __import__('os').environ['BUILD_NUMBER'] + '"', s, count=1)
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs {' not in s:
              s = re.sub(r'\n(\s*)buildTypes\s*\{', lambda m: '\n' + signing + '\n' + m.group(1) + 'buildTypes {', s, count=1)
          s = re.sub(r'(buildTypes\s*\{[\s\S]*?release\s*\{)', lambda m: m.group(1) + '\n            signingConfig signingConfigs.release', s, count=1)
          p.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk app-release.apk
          rm -f android/app/release-key.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shein-al-neel-apk
          path: app-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: شي آن النيل APK - Build ${{ github.run_number }}
          files: app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
