name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'\n      - 'assets/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: 12266719

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/assets@3.0.5 @supabase/supabase-js@2.45.4
          mkdir -p www/vendor
          cp index.html www/index.html
          cp manifest.webmanifest sw.js icon.svg www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js#./vendor/supabase.min.js#' www/index.html
          npx cap init "شي آن النيل" "com.sheinalneel.shop" --web-dir=www
          npx cap add android
          npx cap sync android\n          mkdir -p assets\n          curl -L --fail --retry 3 'https://i.pinimg.com/736x/0a/44/0a/0a440aff794433c1f9074f6aa301c7dd.jpg' -o assets/icon.png\n          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#a8b58a' --splashBackgroundColor '#a8b58a'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shein-al-neel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: شي آن النيل APK - Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
