@keyframes pg{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}@keyframes bn{0%{transform:scale(1)}50%{transform:translateY(-5px) scale(1.25)}100%{transform:translateY(-2px) scale(1.15)}}

/* Premium form cards: shared visual system for customer, debt, payment and expense dialogs */
#md{backdrop-filter:blur(7px);background:rgba(20,28,12,.62);padding:14px}
#md>div{position:relative;overflow:auto;background:linear-gradient(155deg,#fff 0%,#fbfcf6 58%,#f0f3e4 100%);border:1px solid #e1e7cf;border-radius:24px;padding:24px;max-width:620px;box-shadow:0 28px 90px #10180d55}
#mb h3{display:flex;align-items:center;gap:12px;margin:-24px -24px 22px;padding:20px 24px;color:#fff;font-size:19px;background:linear-gradient(120deg,#354218,#657b2d 68%,#87994a);border-radius:0 0 20px 20px;box-shadow:0 8px 22px #43551e28}
#mb h3:before{content:'✦';width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:#ffffff24;border:1px solid #ffffff45;font-size:20px}
#mb label{display:block;margin:12px 2px 4px;color:#52612b;font-weight:700;font-size:13px}
#mb input,#mb select,#mb textarea{display:block;width:100%;min-height:48px;margin:5px 0 12px;padding:12px 14px;border:1px solid #dce3c9;border-radius:13px;background:#fff;box-shadow:0 3px 12px #34451a0a;outline:none;transition:border-color .2s,box-shadow .2s}
#mb input:focus,#mb select:focus,#mb textarea:focus{border-color:#788d3c;box-shadow:0 0 0 4px #788d3c20}
#mb textarea{min-height:90px;resize:vertical}
#mb .c{border:1px solid #dfe6cd;border-radius:15px;background:linear-gradient(135deg,#f8faef,#eef2df)!important;padding:14px;box-shadow:inset 0 1px #fff;margin:10px 0 14px}
#mb .b{min-height:48px;border-radius:13px;background:linear-gradient(120deg,#45551f,#71863a);box-shadow:0 7px 16px #52662b30;transition:transform .18s,filter .18s}
#mb .b:hover{filter:brightness(1.06);transform:translateY(-1px)}
#mb .b:disabled{opacity:.55;transform:none}
#mb .b.s{background:#e8edd9;color:#465621;box-shadow:none}

@media(max-width:600px){#md{align-items:flex-end;padding:8px}#md>div{max-height:91vh;padding:19px;border-radius:22px 22px 16px 16px}#mb h3{margin:-19px -19px 18px;padding:17px 19px;font-size:17px}}

/* SHEIN AL-NEEL — calm animated identity across every screen */
:root{--bg:#e9eddf;--card:rgba(255,255,255,.76);--tx:#25301c;--mu:#68735c;--pr:#53652b;--bd:rgba(111,129,75,.22)}
body{min-height:100vh;background:#e9eddf;isolation:isolate;overflow-x:hidden}
/* خلفية متحركة مرئية وثابتة خلف كل أقسام النظام */
.ambient-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(125deg,#e8eddf,#f2eee2,#e2eadb,#edf0e4);background-size:260% 260%;animation:calmCanvas 28s ease-in-out infinite}
.ambient-bg:before{content:"";position:absolute;inset:-18%;background:radial-gradient(ellipse at 18% 22%,rgba(150,176,94,.42),transparent 34%),radial-gradient(ellipse at 82% 28%,rgba(190,199,145,.44),transparent 32%),radial-gradient(ellipse at 58% 82%,rgba(119,153,93,.34),transparent 36%);filter:blur(22px);animation:softDrift 25s ease-in-out infinite alternate}
.ambient-bg:after{content:"";position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(77,95,48,.28) .7px,transparent .7px);background-size:24px 24px;mask-image:linear-gradient(135deg,#000,transparent 75%)}
body:before,body:after{display:none}
@keyframes calmCanvas{0%,100%{background-position:0% 45%}50%{background-position:100% 55%}}
@keyframes softDrift{0%{transform:translate3d(-2%,0,0) scale(1)}50%{transform:translate3d(2%,2%,0) scale(1.06)}100%{transform:translate3d(-1%,3%,0) scale(1.02)}}
#app{position:relative;z-index:1;background:transparent;min-height:100vh}
.mw{background:transparent}header{background:rgba(250,252,245,.70);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(112,130,75,.20)}
aside{background:linear-gradient(160deg,rgba(48,62,27,.96),rgba(86,105,46,.91),rgba(111,130,65,.88));box-shadow:10px 0 36px rgba(44,59,25,.13);backdrop-filter:blur(16px)}
.st,.c,.c2,.cc,.dc,.sc{background:rgba(255,255,255,.70);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(113,132,75,.22);box-shadow:0 12px 32px rgba(56,73,34,.07)}
.sc{overflow-x:auto}th{background:rgba(226,233,208,.92)}
#md>div{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(244,248,232,.94) 55%,rgba(232,239,216,.96));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 28px 100px rgba(23,34,15,.40)}
#mb input,#mb select,#mb textarea{background:rgba(255,255,255,.88);border-color:rgba(108,127,69,.25)}
#mb .sale-summary{background:linear-gradient(135deg,rgba(236,243,220,.96),rgba(249,251,243,.94));border:1px solid rgba(109,131,66,.24);border-radius:17px;padding:14px 16px;margin:12px 0 16px;box-shadow:inset 0 1px #fff,0 8px 24px rgba(72,91,43,.08)}
.sale-summary .sumline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(100,120,61,.13);font-size:13px}.sale-summary .sumline:last-child{border:0}.sale-summary .sumline b{font-size:14px;color:#34451e}.sale-summary .sumline.due{color:#a43e40}.sale-summary .sumline.due b{color:#b23e43;font-size:16px}
@media(max-width:800px){aside{background:rgba(250,252,245,.84);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-color:rgba(112,130,75,.22)}nav button.on{background:linear-gradient(135deg,#3e4a1d,#6b7d33)}}
@media(prefers-reduced-motion:reduce){body,.ambient-bg,.ambient-bg:before{animation:none!important}*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}


/* ===== الواجهة الرئيسية بالصورة (تصميم شي آن النيل) ===== */
html:has(body.dm){background:#03100a}
body.dm{background:#03100a}
body.dm .ambient-bg,body.dm aside,body.dm header{display:none}
body.dm #app{display:block}
body.dm .mw{width:100%}
body.dm main{padding:0;max-width:none;width:100%;margin:0}
body.dm #tt{bottom:24px}
.dwrap{display:flex;min-height:100vh;min-height:100dvh;overflow:auto;background:#03100a}
.stage{position:relative;flex:none;margin:auto;container-type:inline-size;width:max(min(100vw,calc(100dvh*1672/941)),900px);aspect-ratio:1672/941;user-select:none;-webkit-user-select:none}
.stage>img,.stage>.osv,.stage>.ov{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>img{-webkit-user-drag:none;pointer-events:none}
.osv{pointer-events:none;font-family:Cairo,Tahoma,Arial,sans-serif}
.ov{--u:calc(100cqw/1672);direction:rtl;color:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;pointer-events:none}
.ds{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1.15;pointer-events:none;font-size:calc(var(--u)*20)}
.ds.r{justify-content:flex-start}.ds.l{justify-content:flex-end}
.ds.stk{flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(var(--u)*3)}
.fi{display:inline-flex;align-items:baseline;gap:.3em;transform-origin:center}
.fi i{font-style:normal}
.fi em{font-style:normal;font-weight:800}
.ell{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stk{display:flex;flex-direction:column}

/* البطاقات الأربع */
.cv .fi{font-size:calc(var(--u)*37);font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.38)}
.cv .fi i{font-size:.5em;font-weight:600;opacity:.95}
.cmp{font-size:calc(var(--u)*18.5);font-weight:600;gap:.35em;align-items:center;text-shadow:0 1px 5px rgba(0,0,0,.35)}
.cmp em{font-size:1.15em}
.cmp b{font-weight:700}
.dtx{font-size:calc(var(--u)*19);font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}

/* آخر العمليات */
.dot{border-radius:50%;box-shadow:0 0 0 calc(var(--u)*2.2) rgba(255,255,255,.75),0 calc(var(--u)*2) calc(var(--u)*6) rgba(70,45,25,.3)}
.ds.stk .l1{font-size:calc(var(--u)*20);color:#2a3318;line-height:1.25}
.ds.stk .l1 b{font-weight:700}
.nm{font-weight:500;color:#4a5733}
.ds.stk .l2{font-size:calc(var(--u)*14.5);color:#6c7658;font-weight:500}
.amt{font-size:calc(var(--u)*20);font-weight:700;gap:.3em}
.amt i{font-size:.62em;font-weight:600}
.nodata{font-size:calc(var(--u)*18);color:#6c7658;font-weight:600}
.tcell.nodata{justify-content:center}

/* ملخص الجرد الشهري */
.mth .fi{font-size:calc(var(--u)*23);font-weight:700;color:#fff6dc;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.lgd .fi{font-size:calc(var(--u)*23);font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.lgd .fi i{font-size:.62em;font-weight:600;color:#ffe3a3}
.cn .fi{font-size:calc(var(--u)*28);font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.cu .fi{font-size:calc(var(--u)*19);font-weight:600;color:#fff}

/* جدول الديون */
.tdd{font-size:calc(var(--u)*16);font-weight:600;color:#2a2f1c}
.tdm{font-size:calc(var(--u)*16.5);font-weight:700;gap:.25em}

<script type="text/plain" id="sqlsrc">
-- SHEIN AL-NEEL | شي آن النيل — قاعدة بيانات مفتوحة بدون حسابات (آمن لإعادة التشغيل، لا يحذف البيانات)
create table if not exists customers(id uuid primary key default gen_random_uuid(), name text not null, phone text, address text, notes text, created_at timestamptz default now());
create table if not exists products(id uuid primary key default gen_random_uuid(), name text not null, code text, category text, size text, color text, cost bigint not null default 0 check(cost>=0), price bigint not null default 0 check(price>=0), stock int not null default 0, sold int not null default 0, created_at timestamptz default now());
create table if not exists sales(id uuid primary key default gen_random_uuid(), client_key uuid unique, customer_id uuid references customers, sale_type text not null check(sale_type in('cash','credit','partial')), total_cost bigint not null check(total_cost>=0), total_price bigint not null check(total_price>=0), paid bigint not null check(paid>=0), payment_method text, created_at timestamptz default now(), check(paid<=total_price));
create table if not exists sale_items(id uuid primary key default gen_random_uuid(), sale_id uuid not null references sales, product_id uuid references products, name text not null, qty int not null check(qty>0), cost bigint not null check(cost>=0), price bigint not null check(price>=0));
create table if not exists debts(id uuid primary key default gen_random_uuid(), customer_id uuid not null references customers, sale_id uuid references sales, description text, total bigint not null check(total>0), paid bigint not null default 0, due_date date, created_at timestamptz default now(), check(paid>=0 and paid<=total));
create table if not exists payments(id uuid primary key default gen_random_uuid(), client_key uuid unique, debt_id uuid not null references debts, customer_id uuid not null references customers, amount bigint not null check(amount>0), method text, note text, created_at timestamptz default now());
create table if not exists expenses(id uuid primary key default gen_random_uuid(), kind text not null, amount bigint not null check(amount>0), details text, notes text, created_at timestamptz default now());
create table if not exists activity_logs(id uuid primary key default gen_random_uuid(), action text not null, customer_name text, amount bigint, user_name text, created_at timestamptz default now());
create table if not exists notifications(id uuid primary key default gen_random_uuid(), kind text, message text not null, created_at timestamptz default now());
create index if not exists i1 on customers(name); create index if not exists i2 on debts(customer_id); create index if not exists i3 on payments(debt_id); create index if not exists i4 on sales(created_at);

-- تنظيف أي إعداد قديم فيه حسابات
do $$ declare r record; begin for r in select policyname,tablename from pg_policies where schemaname='public' loop execute format('drop policy %I on %I',r.policyname,r.tablename); end loop; end $$;
drop trigger if exists on_auth_user on auth.users; drop function if exists handle_new_user() cascade; drop table if exists profiles cascade; drop function if exists is_active() cascade; drop function if exists is_admin() cascade;

-- صلاحيات مفتوحة للتطبيق: القراءة للجميع، والكتابة المالية عبر الدوال فقط
do $$ declare t text; begin foreach t in array array['customers','products','sales','sale_items','debts','payments','expenses','activity_logs','notifications'] loop
 execute format('alter table %I enable row level security',t);
 execute format('create policy "read" on %I for select to anon,authenticated using(true)',t); end loop; end $$;
create policy "w" on customers for all to anon,authenticated using(true) with check(true);
create policy "w" on expenses for all to anon,authenticated using(true) with check(true);
create policy "w" on products for all to anon,authenticated using(true) with check(true);
create policy "w" on notifications for insert to anon,authenticated with check(true);
create policy "w" on activity_logs for insert to anon,authenticated with check(true);

create or replace function create_sale(p_customer uuid,p_item text,p_qty int,p_cost bigint,p_price bigint,p_paid bigint,p_due date,p_method text,p_key uuid) returns uuid language plpgsql security definer set search_path=public as $$
declare v_id uuid; v_total bigint:=p_qty*p_price; v_type text; v_name text;
begin
 select id into v_id from sales where client_key=p_key; if found then return v_id; end if;
 if p_qty<=0 or p_price<0 or p_cost<0 or p_paid<0 or p_paid>v_total then raise exception 'قيم غير صحيحة'; end if;
 if p_customer is null and p_paid<v_total then raise exception 'اختر زبوناً للبيع بالدين'; end if;
 v_type:=case when p_paid=v_total then 'cash' when p_paid=0 then 'credit' else 'partial' end;
 insert into sales(client_key,customer_id,sale_type,total_cost,total_price,paid,payment_method) values(p_key,p_customer,v_type,p_qty*p_cost,v_total,p_paid,p_method) returning id into v_id;
 insert into sale_items(sale_id,name,qty,cost,price) values(v_id,p_item,p_qty,p_cost,p_price);
 if p_paid<v_total then insert into debts(customer_id,sale_id,description,total,paid,due_date) values(p_customer,v_id,p_item,v_total,p_paid,p_due); end if;
 select name into v_name from customers where id=p_customer;
 insert into activity_logs(action,customer_name,amount,user_name) values(case when v_type='cash' then 'بيع نقدي' else 'بيع بالدين' end,v_name,v_total,'المحل');
 insert into notifications(kind,message) values('sale','عملية بيع بقيمة '||v_total||' د.ع '||coalesce('— '||v_name,''));
 return v_id;
end $$;

create or replace function add_payment(p_debt uuid,p_amount bigint,p_method text,p_note text,p_key uuid) returns void language plpgsql security definer set search_path=public as $$
declare d debts%rowtype; v_name text;
begin
 if exists(select 1 from payments where client_key=p_key) then return; end if;
 select * into d from debts where id=p_debt for update;
 if not found then raise exception 'الدين غير موجود'; end if;
 if p_amount<=0 or p_amount>d.total-d.paid then raise exception 'المبلغ أكبر من المتبقي أو غير صحيح'; end if;
 insert into payments(client_key,debt_id,customer_id,amount,method,note) values(p_key,p_debt,d.customer_id,p_amount,p_method,p_note);
 update debts set paid=paid+p_amount where id=p_debt;
 select name into v_name from customers where id=d.customer_id;
 insert into activity_logs(action,customer_name,amount,user_name) values('تسديد دين',v_name,p_amount,'المحل');
 insert into notifications(kind,message) values('payment',case when d.paid+p_amount=d.total then 'اكتمل تسديد دين '||v_name else 'تسديد '||p_amount||' د.ع من '||v_name end);
end $$;
revoke all on function create_sale,add_payment from public;
grant execute on function create_sale,add_payment to anon,authenticated;

 begin execute format('alter publication supabase_realtime add table %I',t); exception when duplicate_object then null; end; end loop; end $$;

const _p=(v,t)=>(v/t*100).toFixed(4)+'%';
const bx=(x,y,w,h,cls,inner,st)=>`<div class="ds ${cls||''}" style="left:${_p(x,IMG_W)};top:${_p(y,IMG_H)};width:${_p(w,IMG_W)};height:${_p(h,IMG_H)};${st||''}">${inner}</div>`;
const hz=(x,y,w,h,act,label)=>`<button type="button" class="hz" aria-label="${label}" title="${label}" onclick="${act}" style="left:${_p(x,IMG_W)};top:${_p(y,IMG_H)};width:${_p(w,IMG_W)};height:${_p(h,IMG_H)}"></button>`;
const fn=n=>(Number(n)||0).toLocaleString('en-US');
const mny=n=>`<span class="fi"><b>${fn(n)}</b><i>د.ع</i></span>`;
function cmpK(n){const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';if(a>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n))}
function dtl(v){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',day:'2-digit',month:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v)),g=t=>p.find(x=>x.type===t).value;let h=+g('hour');const ap=h>=12?'م':'ص';h=h%12||12;return `${g('day')}/${g('month')}/${g('year')}  ${h}:${g('minute')} ${ap}`}
function go(t){tab=t;render(1);scrollTo(0,0)}

function daySum(day){const s=S.sales.filter(x=>baghdadDay(x.created_at)===day),e=S.expenses.filter(x=>baghdadDay(x.created_at)===day);
  return{buyers:new Set(s.map(x=>x.customer_id).filter(Boolean)).size,profit:sum(s,'total_price')-sum(s,'total_cost')-sum(e,'amount'),debt:s.reduce((a,x)=>a+Math.max(0,Number(x.total_price)-Number(x.paid)),0)}}
function chg(cur,prev){if(!prev&&!cur)return{t:'0%',d:0};if(!prev)return{t:'جديد',d:cur>0?1:-1};const p=Math.round((cur-prev)/Math.abs(prev)*100);return{t:Math.abs(p)+'%',d:p>0?1:p<0?-1:0}}
const cmpH=(c,label,col)=>`<span class="fi cmp" style="color:${c.d<0?'#ffc4b8':col}"><em>${c.d>0?'↑':c.d<0?'↓':'•'}</em><b>${c.t}</b><span>${label}</span></span>`;

function dailySeries(m,limit){const[y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate(),a=Array(dim+1).fill(0);
  S.sales.forEach(s=>{if(ym(s.created_at)===m)a[+baghdadDay(s.created_at).slice(8,10)]+=Number(s.total_price)-Number(s.total_cost)});
  S.expenses.forEach(e=>{if(ym(e.created_at)===m)a[+baghdadDay(e.created_at).slice(8,10)]-=Number(e.amount)});
  let c=0;const out=[];for(let d=1;d<=Math.min(dim,limit||dim);d++){c+=a[d];out.push(c)}return out}

function mshift(d){const m=window.rm||ym(new Date());let[y,n]=m.split('-').map(Number);n+=d;if(n<1){n=12;y--}if(n>12){n=1;y++}const k=y+'-'+String(n).padStart(2,'0');if(k>ym(new Date()))return;window.rm=k;render()}
function notifM(){om(`<h3>الإشعارات</h3>${S.notifications.slice(0,40).map(n=>`<div class="nt">${esc(n.message)}<small>${dt(n.created_at)}</small></div>`).join('')||'<p>لا توجد إشعارات</p>'}<button class="b s" onclick="cm()" style="margin-top:12px">إغلاق</button>`)}
function setM(){om(`<h3>الإعدادات</h3><div class="c"><div class="nt">حالة الاتصال<small>${DEMO?'غير مربوط بقاعدة البيانات':(navigator.onLine?'متصل':'غير متصل')}</small></div><div class="nt">عدد الزبائن<small>${S.customers.length}</small></div><div class="nt">عدد عمليات البيع<small>${S.sales.length}</small></div></div><button class="b" onclick="cm();load()">تحديث البيانات</button> <button class="b s" onclick="cm()">إغلاق</button>`)}
function outM(){toast('النظام يعمل بدون حسابات، لا يوجد تسجيل دخول')}

function dashView(){
  const now=new Date(),today=baghdadDay(now),yday=baghdadDay(new Date(now-864e5));
  const d0=daySum(today),d1=daySum(yday),mk=ym(now),R0=R(mk),R1=R(prev(mk));

  const monthTxt=new Date(Date.UTC(sy,sm-1,1,12)).toLocaleDateString('ar-IQ-u-nu-latn',{timeZone:'UTC',month:'long',year:'numeric'});
  const dateTxt=now.toLocaleDateString('ar-IQ-u-nu-latn',{timeZone:'Asia/Baghdad',weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let h='';

  /* ---- الترويسة ---- */
  h+=bx(285,38,203,26,'fit r',`<span class="fi dtx">${dateTxt}</span>`,'--o:right');
  h+=bx(35,28,200,57,'conn',`<span class="cdot"></span><span>غير متصل</span>`);

  /* ---- البطاقات الأربع ---- */

    {x:615,w:310,cx:762,ar:790,val:mny(d0.profit),c:chg(d0.profit,d1.profit),lb:'عن الأمس',col:'#fdf9af',go:'rep',n:'ربح اليوم'},
    {x:945,w:325,cx:1092,ar:1115,val:mny(d0.debt),c:chg(d0.debt,d1.debt),lb:'عن الأمس',col:'#e0fab9',go:'debt',n:'ديون اليوم'},
    {x:1290,w:360,cx:1457,ar:1514,val:mny(R0.rev),c:chg(R0.rev,R1.rev),lb:'عن الشهر الماضي',col:'#dafcb6',go:'sale',n:'إجمالي المبيعات'}];
  C.forEach(k=>{
    h+=bx(k.cx-150,207,300,44,'fit cv',k.val);
    h+=bx(k.ar-230,267,230,28,'fit r',cmpH(k.c,k.lb,k.col),'--o:right');
    h+=hz(k.x,122,k.w,192,`go('${k.go}')`,k.n);
  });

  /* ---- آخر العمليات ---- */
  const kc=a=>/نقدي/.test(a)?['#49a04e','#2e6a2a']:/بالدين/.test(a)?['#c4545c','#a3303c']:/تسديد/.test(a)?['#4a93a6','#2a6a7c']:['#d8a84a','#8a6a1c'];
  const rows=[448,506,563,621];
  const rec=S.activity_logs.slice(0,4);
  rec.forEach((x,i)=>{const cy=rows[i],c=kc(x.action||'');
    h+=bx(699,cy-12,24,24,'dot','','background:radial-gradient(circle at 35% 30%,#ffffff99,'+c[0]+' 45%,'+c[0]+')');
    h+=bx(396,cy-26,288,52,'stk r',`<span class="ell l1"><b>${esc(x.action)}</b>${x.customer_name?`<span class="nm"> — ${esc(x.customer_name)}</span>`:''}</span><span class="l2">${dtl(x.created_at)}</span>`);
    if(x.amount)h+=bx(296,cy-20,110,40,'fit l',`<span class="fi amt" style="color:${c[1]}"><b>${fn(x.amount)}</b><i>د.ع</i></span>`,'--o:left');
  });
  if(!rec.length)h+=bx(300,420,384,58,'r nodata','لا توجد عمليات مسجلة بعد');
  h+=hz(288,368,116,34,"go('log')",'عرض كل العمليات');

  /* ---- ملخص الجرد الشهري ---- */
  h+=bx(850,378,190,34,'fit mth',`<span class="fi">شهر ${monthTxt}</span>`);
  h+=hz(1040,371,74,46,'mshift(-1)','الشهر السابق');
  h+=hz(796,371,48,46,'mshift(1)','الشهر التالي');
  const L=[[482,Rs.exp],[530,Rs.gross],[577,Rs.cogs],[621,Rs.rev]];
  L.forEach(([cy,v])=>{h+=bx(800,cy-17,160,34,'fit r lgd',mny(v),'--o:right')});
  const net=Rs.net;
  h+=bx(1214,538,140,34,'fit cn',`<span class="fi" style="color:${net<0?'#ff9c9c':'#fff'}"><b>${fn(net)}</b></span>`);
  h+=bx(1214,574,140,24,'fit cu','<span class="fi"><i>د.ع</i></span>');

  /* ---- ديون الزبائن ---- */
  const dr=S.debts.filter(d=>Number(d.total)>Number(d.paid)).slice(0,3),dy=[806,844,881];
  const col=[[824,166],[648,176],[515,133],[402,113],[290,112]];
  dr.forEach((d,i)=>{const cy=dy[i],rem=Number(d.total)-Number(d.paid);
    const cells=[

      `<span class="stk ctr"><span class="ell l1"><b>${esc(d.description||'—')}</b></span><span class="ell l2">${esc(cust(d.customer_id))}</span></span>`,
      `<span class="fi tdm" style="color:#2a2f1c">${'<b>'+fn(d.total)+'</b><i>د.ع</i>'}</span>`,
      `<span class="fi tdm" style="color:#2a6a2a">${'<b>'+fn(d.paid)+'</b><i>د.ع</i>'}</span>`,
      `<span class="fi tdm" style="color:#a3303c">${'<b>'+fn(rem)+'</b><i>د.ع</i>'}</span>`];

  if(!dr.length)h+=bx(290,788,700,37,'tcell nodata','لا توجد ديون متبقية');
  h+=hz(288,706,116,36,"go('debt')",'عرض كل الديون');

  /* ---- أزرار القائمة الجانبية ---- */
  [[124,77,"go('dash')",'الرئيسية'],[210,62,'custForm()','إضافة زبون'],[276,64,'saleForm()','إضافة دين'],[343,62,"go('sale')",'المبيعات'],
   [410,60,"go('debt')",'تسديد دين'],[475,60,"go('exp')",'المصروفات'],[540,57,"go('rep')",'الجرد'],[603,54,'notifM()','الإشعارات'],
   [659,49,'setM()','الإعدادات'],[712,50,'outM()','تسجيل خروج']].forEach(n=>{h+=hz(24,n[0],228,n[1],n[2],n[3])});

  return `<div class="dwrap"><div class="stage"><img src="${DASH_IMG}" alt="" draggable="false"><svg class="osv" viewBox="0 0 ${IMG_W} ${IMG_H}" aria-hidden="true">${ringSvg(Rs)}${chartSvg(mk)}</svg><div class="ov">${h}</div></div></div>`;
}

/* ---- الحلقة (تُرسم فوق حلقة الصورة بنفس الأبعاد والألوان) ---- */
function ringSvg(r){
  const cx=1283.5,cy=540.5,rr=94.8,sw=34,cogs=Math.max(0,r.cogs),ex=Math.max(0,r.exp),nt=Math.max(0,r.net),tot=cogs+ex+nt;
  let s='';
  if(tot<=0)s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#2b4a33" stroke-width="${sw}"/>`;
  else{let st=0;[[cogs,'#f9ae42'],[ex,'#ef4a50'],[nt,'#55d06b']].forEach(([v,c])=>{if(v<=0)return;const l=v/tot*100;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${c}" stroke-width="${sw}" pathLength="100" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${-st}" transform="rotate(-90 ${cx} ${cy})"/>`;st+=l})}
  s+=`<circle cx="${cx}" cy="${cy}" r="${rr+sw/2-.6}" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.2"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${rr-sw/2+.8}" fill="none" stroke="#eafbe6" stroke-opacity=".9" stroke-width="1.8"/>`;
  return s}

/* ---- الرسم البياني: صافي الربح التراكمي (هذا الشهر مقابل الشهر الماضي) ---- */
function chartSvg(mk){
  const x0=1066,x1=1625,yT=791,yB=875,td=+baghdadDay(new Date()).slice(8,10);
  const cur=dailySeries(mk,td),pv=dailySeries(prev(mk));
  const all=[0,...cur,...pv],hi=Math.max(1,...all),lo=Math.min(0,...all),rg=hi-lo||1;
  const X=d=>x0+(d-1)/30*(x1-x0),Y=v=>yB-(v-lo)/rg*(yB-yT);
  const pts=a=>a.map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  let s='';
  [0,1,2,3].forEach(i=>{const y=yB-i*(yB-yT)/3,v=lo+i*rg/3;s+=`<text x="1060" y="${(y+3.6).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#cfd8c4" fill-opacity=".85">${cmpK(v)}</text>`});
  [1,5,10,15,20,25].forEach(d=>{s+=`<text x="${X(d).toFixed(1)}" y="${yB+19}" text-anchor="middle" font-size="11" fill="#b9c4ac" fill-opacity=".85">${d}</text>`});
  if(lo<0)s+=`<line x1="${x0}" x2="${x1}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#cfd8c4" stroke-opacity=".45" stroke-dasharray="4 4"/>`;
  if(pv.length>1)s+=`<polyline points="${pts(pv)}" fill="none" stroke="#74e57c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(cur.length){
    if(cur.length>1)s+=`<polygon points="${X(1).toFixed(1)},${yB} ${pts(cur)} ${X(cur.length).toFixed(1)},${yB}" fill="#e4c08e" fill-opacity=".16"/>`;
    s+=`<polyline points="${pts(cur)}" fill="none" stroke="#e4c08e" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lx=X(cur.length),ly=Y(cur[cur.length-1]);
    s+=`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.2" fill="#e4c08e" stroke="#0a1a0f" stroke-width="1.5"/>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly<yT+14?ly+18:ly-9).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f3d6ad">${cmpK(cur[cur.length-1])}</text>`}
  if(pv.length>1){const lx=X(pv.length),ly=Y(pv[pv.length-1]);
    s+=`<text x="${(lx-4).toFixed(1)}" y="${(ly<yT+14?ly+18:ly-9).toFixed(1)}" text-anchor="end" font-size="12.5" font-weight="700" fill="#8ff095">${cmpK(pv[pv.length-1])}</text>`}
  return s}

/* ---- ملاءمة الأرقام الطويلة داخل خاناتها ---- */
function dashFit(){document.querySelectorAll('#mn .fit').forEach(b=>{const s=b.firstElementChild;if(!s)return;s.style.transform='';const bw=b.clientWidth,sw=s.offsetWidth;
  if(bw&&sw>bw){s.style.transformOrigin=(b.style.getPropertyValue('--o')||'center');s.style.transform=`scale(${(bw/sw).toFixed(3)})`}})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(tab==='dash')dashFit()});

start();
