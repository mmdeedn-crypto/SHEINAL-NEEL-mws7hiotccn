/* SHEIN AL-NEEL — calm animated identity across every screen */
:root{--bg:#e9eddf;--card:rgba(255,255,255,.76);--tx:#25301c;--mu:#68735c;--pr:#53652b;--bd:rgba(111,129,75,.22)}
body{min-height:100vh;background:#e9eddf;isolation:isolate;overflow-x:hidden}
/* خلفية متحركة مرئية وثابتة خلف كل أقسام النظام */
.ambient-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(125deg,#e8eddf,#f2eee2,#e2eadb,#edf0e4);background-size:260% 260%;animation:calmCanvas 28s ease-in-out infinite}
.ambient-bg:before{content:"";position:absolute;inset:-18%;background:radial-gradient(ellipse at 18% 22%,rgba(150,176,94,.42),transparent 34%),radial-gradient(ellipse at 82% 28%,rgba(190,199,145,.44),transparent 32%),radial-gradient(ellipse at 58% 82%,rgba(119,153,93,.34),transparent 36%);filter:blur(22px);animation:softDrift 25s ease-in-out infinite alternate}
.ambient-bg:after{content:"";position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(77,95,48,.28) .7px,transparent .7px);background-size:24px 24px;mask-image:linear-gradient(135deg,#000,transparent 75%)}
body:before,body:after{display:none}
@keyframes calmCanvas{0%,100%{background-position:0% 45%}50%{background-position:100% 55%}}
@keyframes softDrift{0%{transform:translate3d(-2%,0,0) scale(1)}50%{transform:translate3d(2%,2%,0) scale(1.06)}100%{transform:translate3d(-1%,3%,0) scale(1.02)}}

.st,.c,.c2,.cc,.dc,.sc{background:rgba(255,255,255,.70);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(113,132,75,.22);box-shadow:0 12px 32px rgba(56,73,34,.07)}

-- SHEIN AL-NEEL | شي آن النيل — قاعدة بيانات مفتوحة بدون حسابات (آمن لإعادة التشغيل، لا يحذف البيانات)
create table if not exists customers(id uuid primary key default gen_random_uuid(), name text not null, phone text, address text, notes text, created_at timestamptz default now());
create table if not exists products(id uuid primary key default gen_random_uuid(), name text not null, code text, category text, size text, color text, cost bigint not null default 0 check(cost>=0), price bigint not null default 0 check(price>=0), stock int not null default 0, sold int not null default 0, created_at timestamptz default now());
create table if not exists sales(id uuid primary key default gen_random_uuid(), client_key uuid unique, customer_id uuid references customers, sale_type text not null check(sale_type in('cash','credit','partial')), total_cost bigint not null check(total_cost>=0), total_price bigint not null check(total_price>=0), paid bigint not null check(paid>=0), payment_method text, created_at timestamptz default now(), check(paid<=total_price));
create table if not exists sale_items(id uuid primary key default gen_random_uuid(), sale_id uuid not null references sales, product_id uuid references products, name text not null, qty int not null check(qty>0), cost bigint not null check(cost>=0), price bigint not null check(price>=0));
create table if not exists debts(id uuid primary key default gen_random_uuid(), customer_id uuid not null references customers, sale_id uuid references sales, description text, total bigint not null check(total>0), paid bigint not null default 0, due_date date, created_at timestamptz default now(), check(paid>=0 and paid<=total));
create table if not exists payments(id uuid primary key default gen_random_uuid(), client_key uuid unique, debt_id uuid not null references debts, customer_id uuid not null references customers, amount bigint not null check(amount>0), method text, note text, created_at timestamptz default now());
create table if not exists expenses(id uuid primary key default gen_random_uuid(), kind text not null, amount bigint not null check(amount>0), details text, notes text, created_at timestamptz default now());
create table if not exists activity_logs(id uuid primary key default gen_random_uuid(), action text not null, customer_name text, amount bigint, user_name text, created_at timestamptz default now());
create table if not exists notifications(id uuid primary key default gen_random_uuid(), kind text, message text not null, created_at timestamptz default now());
alter table sales add column if not exists seller text; alter table debts add column if not exists seller text; alter table payments add column if not exists seller text;
drop function if exists create_sale(uuid,text,int,bigint,bigint,bigint,date,text,uuid); drop function if exists add_payment(uuid,bigint,text,text,uuid);
create index if not exists i1 on customers(name); create index if not exists i2 on debts(customer_id); create index if not exists i3 on payments(debt_id); create index if not exists i4 on sales(created_at);

-- تنظيف أي إعداد قديم فيه حسابات
do $$ declare r record; begin for r in select policyname,tablename from pg_policies where schemaname='public' loop execute format('drop policy %I on %I',r.policyname,r.tablename); end loop; end $$;

-- صلاحيات مفتوحة للتطبيق: القراءة للجميع، والكتابة المالية عبر الدوال فقط
do $$ declare t text; begin foreach t in array array['customers','products','sales','sale_items','debts','payments','expenses','activity_logs','notifications'] loop
 execute format('alter table %I enable row level security',t);
 execute format('create policy "read" on %I for select to anon,authenticated using(true)',t); end loop; end $$;
create policy "w" on customers for all to anon,authenticated using(true) with check(true);
create policy "w" on expenses for all to anon,authenticated using(true) with check(true);
create policy "w" on products for all to anon,authenticated using(true) with check(true);
create policy "w" on notifications for insert to anon,authenticated with check(true);
create policy "w" on activity_logs for insert to anon,authenticated with check(true);

create or replace function create_sale(p_customer uuid,p_item text,p_qty int,p_cost bigint,p_price bigint,p_paid bigint,p_due date,p_method text,p_key uuid,p_seller text default null) returns uuid language plpgsql security definer set search_path=public as $$
declare v_id uuid; v_total bigint:=p_qty*p_price; v_type text; v_name text;
begin
 select id into v_id from sales where client_key=p_key; if found then return v_id; end if;
 if p_qty<=0 or p_price<0 or p_cost<0 or p_paid<0 or p_paid>v_total then raise exception 'قيم غير صحيحة'; end if;
 if p_customer is null and p_paid<v_total then raise exception 'اختر زبوناً للبيع بالدين'; end if;
 v_type:=case when p_paid=v_total then 'cash' when p_paid=0 then 'credit' else 'partial' end;
 insert into sales(client_key,customer_id,sale_type,total_cost,total_price,paid,payment_method,seller) values(p_key,p_customer,v_type,p_qty*p_cost,v_total,p_paid,p_method,p_seller) returning id into v_id;
 insert into sale_items(sale_id,name,qty,cost,price) values(v_id,p_item,p_qty,p_cost,p_price);
 if p_paid<v_total then insert into debts(customer_id,sale_id,description,total,paid,due_date,seller) values(p_customer,v_id,p_item,v_total,p_paid,p_due,p_seller); end if;
 select name into v_name from customers where id=p_customer;
 insert into activity_logs(action,customer_name,amount,user_name) values(case when v_type='cash' then 'بيع نقدي' else 'بيع بالدين' end,v_name,v_total,coalesce(p_seller,'المحل'));
 insert into notifications(kind,message) values('sale','عملية بيع بقيمة '||v_total||' د.ع '||coalesce('— '||v_name,''));
 return v_id;
end $$;

create or replace function add_payment(p_debt uuid,p_amount bigint,p_method text,p_note text,p_key uuid,p_seller text default null) returns void language plpgsql security definer set search_path=public as $$
declare d debts%rowtype; v_name text;
begin
 if exists(select 1 from payments where client_key=p_key) then return; end if;
 select * into d from debts where id=p_debt for update;
 if not found then raise exception 'الدين غير موجود'; end if;
 if p_amount<=0 or p_amount>d.total-d.paid then raise exception 'المبلغ أكبر من المتبقي أو غير صحيح'; end if;
 insert into payments(client_key,debt_id,customer_id,amount,method,note,seller) values(p_key,p_debt,d.customer_id,p_amount,p_method,p_note,p_seller);
 update debts set paid=paid+p_amount where id=p_debt;
 select name into v_name from customers where id=d.customer_id;
 insert into activity_logs(action,customer_name,amount,user_name) values('تسديد دين',v_name,p_amount,coalesce(p_seller,'المحل'));
 insert into notifications(kind,message) values('payment',case when d.paid+p_amount=d.total then 'اكتمل تسديد دين '||v_name else 'تسديد '||p_amount||' د.ع من '||v_name end);
end $$;
revoke all on function create_sale,add_payment from public;
grant execute on function create_sale,add_payment to anon,authenticated;

 <label>تفاصيل القطعة</label><input id="it" placeholder="مثال: قميص / بنطلون / فستان"><label>الكمية</label><input id="q" inputmode="numeric" placeholder="الكمية" value="1" oninput="sc2()"><label>سعر القطعة (د.ع)</label><input id="pr" inputmode="numeric" placeholder="أدخل سعر بيع القطعة" oninput="mon(this);sc2()"><label>المبلغ المستلم (د.ع)</label><input id="pd" inputmode="numeric" placeholder="المبلغ المستلم الآن" value="0" oninput="mon(this);sc2()"><div id="tl" class="sale-summary"></div><div class="c" style="margin-bottom:10px"><small>تاريخ تسجيل العملية (تلقائي)</small><b style="display:block">${today}</b></div><label>موعد التسديد المتفق عليه (اختياري)</label><input id="du" type="date" lang="ar-IQ" dir="ltr"><label>طريقة الاستلام</label><select id="me"><option>نقدي</option><option>تحويل</option><option>بطاقة</option></select>${sellerSel('sl')}<button class="b" id="sv" onclick="saveSale()" style="width:100%;margin-top:8px">حفظ العملية</button>`);customerPicked();sc2()}
function customerPicked(){const id=$('sc')?.value,c=S.customers.find(x=>x.id==id),box=$('customerInfo'),nw=$('newCustomer');if(!box||!nw)return;if(c){nw.style.display='none';box.style.display='block';box.innerHTML=`<b>بيانات الزبون</b><div style="margin-top:6px">الاسم: ${esc(c.name)}<br>رقم الهاتف: ${esc(c.phone||'غير مسجل')}<br>العنوان: ${esc(c.address||'غير مسجل')}<br>ملاحظات: ${esc(c.notes||'لا توجد')}</div>`}else{nw.style.display='block';box.style.display='none';box.innerHTML=''}}
function sc2(){const q=num($('q')?.value),price=num($('pr')?.value),t=q*price,paid=num($('pd')?.value),remaining=Math.max(0,t-paid),el=$('tl');if(el)el.innerHTML=`<div class="sumline"><span>إجمالي البيع</span><b>${f(t)}</b></div><div class="sumline"><span>المبلغ المستلم</span><b>${f(paid)}</b></div><div class="sumline due"><span>المتبقي على الزبون</span><b>${f(remaining)}</b></div>`}
async function saveSale(){if(DEMO)return toast('اربط قاعدة البيانات أولاً (تبويب الإعداد)');const qty=num($('q').value),price=num($('pr').value),paid=num($('pd').value),customer=$('sc').value,newName=$('sn')?.value.trim();if(!qty||!price)return toast('أدخل الكمية وسعر القطعة');if(!$('sl').value)return toast('اختر البائع');if(paid>qty*price)return toast('المبلغ المستلم أكبر من إجمالي البيع');if(paid<qty*price&&!customer&&!newName)return toast('اختر زبوناً أو أضف زبوناً جديداً للدين');const b=$('sv');b.disabled=true;try{let c=$('sc').value;if(!c&&$('sn').value.trim())c=(await mkCust($('sn').value.trim(),$('sp').value,'','')).id;
 const{error}=await sb.rpc('create_sale',{p_customer:c||null,p_item:$('it').value||'ملابس',p_qty:num($('q').value),p_cost:0,p_price:num($('pr').value),p_paid:num($('pd').value),p_due:$('du').value||null,p_method:$('me').value,p_key:key,p_seller:$('sl').value});if(error)throw error;cm();toast('تم تسجيل العملية');load()}catch(e){toast(missFn(e)?'شغّل ملف add-seller.sql في Supabase أولاً':e.message?.includes('fetch')?'لا يوجد اتصال، أعد المحاولة':'تعذر الحفظ: '+(e.message||''))}b.disabled=false}
function payForm(id){key=crypto.randomUUID();const d=S.debts.find(x=>x.id==id);om(`<h3>تسديد — ${esc(cust(d.customer_id))}</h3><p>المتبقي: ${f(d.total-d.paid)}</p><input id="pa" inputmode="numeric" placeholder="المبلغ" oninput="mon(this)"><select id="pm"><option>نقدي</option><option>تحويل</option></select><input id="pn" placeholder="ملاحظات">${sellerSel('ps')}<button class="b" onclick="savePay('${id}')">تسجيل التسديد</button>`)}
async function savePay(id){if(DEMO)return toast('اربط قاعدة البيانات أولاً (تبويب الإعداد)');if(!$('ps').value)return toast('اختر البائع');const{error}=await sb.rpc('add_payment',{p_debt:id,p_amount:num($('pa').value),p_method:$('pm').value,p_note:$('pn').value,p_key:key,p_seller:$('ps').value});if(error)return toast(missFn(error)?'شغّل ملف add-seller.sql في Supabase أولاً':error.message.includes('المتبقي')?'المبلغ أكبر من المتبقي':'تعذر التسجيل');cm();toast('تم التسديد');load()}
async function addExp(){if(DEMO)return toast('اربط قاعدة البيانات أولاً (تبويب الإعداد)');const a=num($('xa').value);if(!a)return toast('أدخل المبلغ');const{error}=await sb.from('expenses').insert({kind:$('xk').value,amount:a,details:$('xd').value});error?toast('تعذر الحفظ'):(toast('تم الحفظ'),load())}
function cdet(id){const c=S.customers.find(x=>x.id==id),d=S.debts.filter(x=>x.customer_id==id),p=S.payments.filter(x=>x.customer_id==id),s=S.sales.filter(x=>x.customer_id==id),rem=sum(d,'total')-sum(d,'paid');
 om(`<div id="stm" class="doc"><div class="dt"><b>SHEIN AL-NEEL</b><span>كشف حساب زبون – شي آن النيل</span></div><div class="cch"><div class="av">${esc(c.name[0])}</div><div><b>${esc(c.name)}</b><br><small>${esc(c.phone||'')} — بداية التعامل: ${dt(c.created_at)}</small></div></div>
<div class="g4">${[['المشتريات',sum(s,'total_price')],['إجمالي الديون',sum(d,'total')],['المسدد',sum(d,'paid')],['المتبقي',rem]].map(x=>`<div class="bx"><small>${x[0]}</small><b>${f(x[1])}</b></div>`).join('')}</div>
<h4>الديون</h4>${TB(['التاريخ','الوصف','الإجمالي','المتبقي','البائع'],d.map(x=>[dt(x.created_at),esc(x.description),f(x.total),f(x.total-x.paid),esc(x.seller||'—')]))}<h4>التسديدات</h4>${TB(['التاريخ','المبلغ','الطريقة','البائع'],p.map(x=>[dt(x.created_at),f(x.amount),esc(x.method),esc(x.seller||'—')]))}<div class="ft">SHEIN AL-NEEL | شي آن النيل — تقرير مُنشأ آلياً من نظام المحاسبة</div></div>
<div class="np" style="display:flex;gap:8px;margin-top:12px"><button class="b" onclick="pdf('stm','كشف-حساب')">⬇ تحميل PDF</button><button class="b s" onclick="cm()">إغلاق</button></div>`)}
/* ============================================================
   الواجهة الرئيسية: الصورة هي التصميم، وأرقام النظام فوقها فقط
   كل الإحداثيات بوحدات بكسل الصورة الأصلية (1672 × 941)
   ============================================================ */
const fn=n=>(Number(n)||0).toLocaleString('en-US');
const mny=n=>`<span class="fi"><b>${fn(n)}</b><i>د.ع</i></span>`;
function cmpK(n){const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';if(a>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n))}
function dtl(v){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',day:'2-digit',month:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v)),g=t=>p.find(x=>x.type===t).value;let h=+g('hour');const ap=h>=12?'م':'ص';h=h%12||12;return `${g('day')}/${g('month')}/${g('year')}  ${h}:${g('minute')} ${ap}`}
function go(t){tab=t;render(1);scrollTo(0,0)}

function daySum(day){const s=S.sales.filter(x=>baghdadDay(x.created_at)===day),e=S.expenses.filter(x=>baghdadDay(x.created_at)===day);
  return{buyers:new Set(s.map(x=>x.customer_id).filter(Boolean)).size,profit:sum(s,'total_price')-sum(s,'total_cost')-sum(e,'amount'),debt:s.reduce((a,x)=>a+Math.max(0,Number(x.total_price)-Number(x.paid)),0)}}
function chg(cur,prev){if(!prev&&!cur)return{t:'0%',d:0};if(!prev)return{t:'جديد',d:cur>0?1:-1};const p=Math.round((cur-prev)/Math.abs(prev)*100);return{t:Math.abs(p)+'%',d:p>0?1:p<0?-1:0}}

function dailySeries(m,limit){const[y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate(),a=Array(dim+1).fill(0);
  S.sales.forEach(s=>{if(ym(s.created_at)===m)a[+baghdadDay(s.created_at).slice(8,10)]+=Number(s.total_price)-Number(s.total_cost)});
  S.expenses.forEach(e=>{if(ym(e.created_at)===m)a[+baghdadDay(e.created_at).slice(8,10)]-=Number(e.amount)});
  let c=0;const out=[];for(let d=1;d<=Math.min(dim,limit||dim);d++){c+=a[d];out.push(c)}return out}

function mshift(d){const m=window.rm||ym(new Date());let[y,n]=m.split('-').map(Number);n+=d;if(n<1){n=12;y--}if(n>12){n=1;y++}const k=y+'-'+String(n).padStart(2,'0');if(k>ym(new Date()))return;window.rm=k;render()}
function notifM(){om(`<h3>الإشعارات</h3>${S.notifications.slice(0,40).map(n=>`<div class="nt">${esc(n.message)}<small>${dt(n.created_at)}</small></div>`).join('')||'<p>لا توجد إشعارات</p>'}<button class="b s" onclick="cm()" style="margin-top:12px">إغلاق</button>`)}
function setM(){om(`<h3>الإعدادات</h3><div class="c"><div class="nt">حالة الاتصال<small>${DEMO?'غير مربوط بقاعدة البيانات':(navigator.onLine?'متصل':'غير متصل')}</small></div><div class="nt">عدد الزبائن<small>${S.customers.length}</small></div><div class="nt">عدد عمليات البيع<small>${S.sales.length}</small></div></div><button class="b" onclick="cm();load()">تحديث البيانات</button> <button class="b s" onclick="cm()">إغلاق</button>`)}
function outM(){toast('النظام يعمل بدون حسابات، لا يوجد تسجيل دخول')}

function donut(r){const a=[[Math.max(0,r.cogs),'#e0a030'],[Math.max(0,r.exp),'#d03b4b'],[Math.max(0,r.net),'#16915f']],t=a.reduce((x,y)=>x+y[0],0);let o=0,h='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e3e8d2" stroke-width="16"/>';if(t>0)a.forEach(([v,c])=>{if(v<=0)return;const l=v/t*100;h+=`<circle cx="50" cy="50" r="38" fill="none" stroke="${c}" stroke-width="16" pathLength="100" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l});return h+'</svg>'}
function lineChart(m){const mk=ym(new Date()),td=m==mk?+baghdadDay(new Date()).slice(8,10):31,cur=dailySeries(m,td),pv=dailySeries(prev(m)),all=[0,...cur,...pv],hi=Math.max(1,...all),lo=Math.min(0,...all),rg=hi-lo||1,X=d=>10+(d-1)/30*540,Y=v=>160-(v-lo)/rg*140,P=a=>a.map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
 return`<svg viewBox="0 0 560 190" style="width:100%;height:auto">${[0,1,2,3].map(i=>{const y=160-i*140/3;return`<line x1="10" x2="550" y1="${y}" y2="${y}" stroke="#dfe3cf"/><text x="12" y="${y-4}" font-size="10" fill="#6f7660">${cmpK(lo+i*rg/3)}</text>`}).join('')}${pv.length>1?`<polyline points="${P(pv)}" fill="none" stroke="#9aa97a" stroke-width="2.4" stroke-dasharray="5 4"/>`:''}${cur.length>1?`<polyline points="${P(cur)}" fill="none" stroke="#5f6f2c" stroke-width="3" stroke-linejoin="round"/>`:''}${[1,5,10,15,20,25,30].map(d=>`<text x="${X(d)}" y="182" font-size="10.5" text-anchor="middle" fill="#6f7660">${d}</text>`).join('')}</svg>`}
function dashView(){const now=new Date(),mk=ym(now),sel=window.rm||mk,d0=daySum(baghdadDay(now)),d1=daySum(baghdadDay(new Date(now-864e5))),R0=R(mk),R1=R(prev(mk)),Rs=R(sel),[sy,sm]=sel.split('-').map(Number),
 mt=new Date(Date.UTC(sy,sm-1,1,12)).toLocaleDateString('ar-IQ-u-nu-latn',{timeZone:'UTC',month:'long',year:'numeric'}),
 dtx=now.toLocaleDateString('ar-IQ-u-nu-latn',{timeZone:'Asia/Baghdad',weekday:'long',day:'numeric',month:'long',year:'numeric'}),
 cp=(c,l)=>`<span class="dl ${c.d>0?'up':c.d<0?'dn':''}">${c.d>0?'↑':c.d<0?'↓':'•'} ${c.t} ${l}</span>`,
 K=[['👥','عدد الزبائن اليوم',fn(d0.buyers)+' زبون',chg(d0.buyers,d1.buyers),'عن الأمس','debt','g'],['💰','ربح اليوم',f(d0.profit),chg(d0.profit,d1.profit),'عن الأمس','rep','y'],['💳','ديون اليوم',f(d0.debt),chg(d0.debt,d1.debt),'عن الأمس','debt','r'],['🛍️','مبيعات الشهر',f(R0.rev),chg(R0.rev,R1.rev),'عن الشهر الماضي','sale','p']],
 kc=a=>/نقدي/.test(a)?'#49a04e':/بالدين/.test(a)?'#c4545c':/تسديد/.test(a)?'#4a93a6':'#d8a84a',
 dr=S.debts.filter(d=>rmn(d)>0).sort((a,b)=>rmn(b)-rmn(a)).slice(0,5),
 L=[['المبيعات',Rs.rev,'#5f6f2c'],['تكلفة البضاعة',Rs.cogs,'#e0a030'],['الربح قبل المصاريف',Rs.gross,'#8c9f3f'],['المصاريف',Rs.exp,'#d03b4b'],['صافي الربح',Rs.net,'#16915f']];
 return`<div class="dash"><div class="dhero"><div><h2>مرحباً بك في شي آن النيل</h2><small>${dtx}</small></div><div class="mnav"><button onclick="mshift(-1)" aria-label="الشهر السابق">→</button><span>${mt}</span><button onclick="mshift(1)" aria-label="الشهر التالي">←</button></div></div>
<div class="qa"><button onclick="saleForm()">➕ دين / بيع جديد</button><button onclick="go('debt')">💳 تسديد دين</button><button onclick="go('exp')">🧾 مصروف</button><button onclick="go('rep')">📊 الجرد</button></div>
<div class="kp">${K.map(k=>`<div class="st kc" onclick="go('${k[5]}')"><div class="ic ${k[6]}">${k[0]}</div><div><small>${k[1]}</small><b>${k[2]}</b>${cp(k[3],k[4])}</div></div>`).join('')}</div>
<div class="dg"><div class="c2"><h3>ملخص الجرد — ${mt}</h3><div class="ring">${donut(Rs)}<div class="lgl">${L.map(x=>`<div><span><i style="background:${x[2]}"></i>${x[0]}</span><b>${f(x[1])}</b></div>`).join('')}</div></div></div>
<div class="c2"><h3>صافي الربح التراكمي</h3>${lineChart(sel)}<small style="color:var(--mu)">الخط المتصل: هذا الشهر — المتقطع: الشهر السابق</small></div></div>
<div class="dg"><div class="c2"><h3>آخر العمليات <button class="lk" onclick="go('log')">عرض الكل</button></h3>${S.activity_logs.slice(0,6).map(x=>`<div class="op"><i style="background:${kc(x.action||'')}"></i><div><b>${esc(x.action)}</b>${x.customer_name?' — '+esc(x.customer_name):''}<small>${dtl(x.created_at)}</small></div>${x.amount?`<b>${f(x.amount)}</b>`:''}</div>`).join('')||'<small>لا توجد عمليات مسجلة بعد</small>'}</div>
<div class="c2"><h3>أكبر الديون المتبقية <button class="lk" onclick="go('debt')">عرض الكل</button></h3>${dr.map(d=>`<div class="op" style="cursor:pointer" onclick="go('debt')"><i style="background:${status(d)[1]}"></i><div><b>${esc(cust(d.customer_id))}</b><small>${esc(d.description||'—')}${d.due_date?' — '+d.due_date:''}</small></div><b class="bad">${f(rmn(d))}</b></div>`).join('')||'<small>لا توجد ديون متبقية</small>'}</div></div></div>`}
