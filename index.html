<script type="text/plain" id="sqlsrc">
-- SHEIN AL-NEEL | شي آن النيل — قاعدة بيانات مفتوحة بدون حسابات (آمن لإعادة التشغيل، لا يحذف البيانات)
create table if not exists customers(id uuid primary key default gen_random_uuid(), name text not null, phone text, address text, notes text, created_at timestamptz default now());
create table if not exists products(id uuid primary key default gen_random_uuid(), name text not null, code text, category text, size text, color text, cost bigint not null default 0 check(cost>=0), price bigint not null default 0 check(price>=0), stock int not null default 0, sold int not null default 0, created_at timestamptz default now());
create table if not exists sales(id uuid primary key default gen_random_uuid(), client_key uuid unique, customer_id uuid references customers, sale_type text not null check(sale_type in('cash','credit','partial')), total_cost bigint not null check(total_cost>=0), total_price bigint not null check(total_price>=0), paid bigint not null check(paid>=0), payment_method text, created_at timestamptz default now(), check(paid<=total_price));
create table if not exists sale_items(id uuid primary key default gen_random_uuid(), sale_id uuid not null references sales, product_id uuid references products, name text not null, qty int not null check(qty>0), cost bigint not null check(cost>=0), price bigint not null check(price>=0));
create table if not exists debts(id uuid primary key default gen_random_uuid(), customer_id uuid not null references customers, sale_id uuid references sales, description text, total bigint not null check(total>0), paid bigint not null default 0, due_date date, created_at timestamptz default now(), check(paid>=0 and paid<=total));
create table if not exists payments(id uuid primary key default gen_random_uuid(), client_key uuid unique, debt_id uuid not null references debts, customer_id uuid not null references customers, amount bigint not null check(amount>0), method text, note text, created_at timestamptz default now());
create table if not exists expenses(id uuid primary key default gen_random_uuid(), kind text not null, amount bigint not null check(amount>0), details text, notes text, created_at timestamptz default now());
create table if not exists activity_logs(id uuid primary key default gen_random_uuid(), action text not null, customer_name text, amount bigint, user_name text, created_at timestamptz default now());
create table if not exists notifications(id uuid primary key default gen_random_uuid(), kind text, message text not null, created_at timestamptz default now());
create index if not exists i1 on customers(name); create index if not exists i2 on debts(customer_id); create index if not exists i3 on payments(debt_id); create index if not exists i4 on sales(created_at);

-- تنظيف أي إعداد قديم فيه حسابات
do $$ declare r record; begin for r in select policyname,tablename from pg_policies where schemaname='public' loop execute format('drop policy %I on %I',r.policyname,r.tablename); end loop; end $$;
drop trigger if exists on_auth_user on auth.users; drop function if exists handle_new_user() cascade; drop table if exists profiles cascade; drop function if exists is_active() cascade; drop function if exists is_admin() cascade;

-- صلاحيات مفتوحة للتطبيق: القراءة للجميع، والكتابة المالية عبر الدوال فقط
do $$ declare t text; begin foreach t in array array['customers','products','sales','sale_items','debts','payments','expenses','activity_logs','notifications'] loop
 execute format('alter table %I enable row level security',t);
 execute format('create policy "read" on %I for select to anon,authenticated using(true)',t); end loop; end $$;
create policy "w" on customers for all to anon,authenticated using(true) with check(true);
create policy "w" on expenses for all to anon,authenticated using(true) with check(true);
create policy "w" on products for all to anon,authenticated using(true) with check(true);
create policy "w" on notifications for insert to anon,authenticated with check(true);
create policy "w" on activity_logs for insert to anon,authenticated with check(true);

create or replace function create_sale(p_customer uuid,p_item text,p_qty int,p_cost bigint,p_price bigint,p_paid bigint,p_due date,p_method text,p_key uuid) returns uuid language plpgsql security definer set search_path=public as $$
declare v_id uuid; v_total bigint:=p_qty*p_price; v_type text; v_name text;
begin
 select id into v_id from sales where client_key=p_key; if found then return v_id; end if;
 if p_qty<=0 or p_price<0 or p_cost<0 or p_paid<0 or p_paid>v_total then raise exception 'قيم غير صحيحة'; end if;
 if p_customer is null and p_paid<v_total then raise exception 'اختر زبوناً للبيع بالدين'; end if;
 v_type:=case when p_paid=v_total then 'cash' when p_paid=0 then 'credit' else 'partial' end;
 insert into sales(client_key,customer_id,sale_type,total_cost,total_price,paid,payment_method) values(p_key,p_customer,v_type,p_qty*p_cost,v_total,p_paid,p_method) returning id into v_id;
 insert into sale_items(sale_id,name,qty,cost,price) values(v_id,p_item,p_qty,p_cost,p_price);
 if p_paid<v_total then insert into debts(customer_id,sale_id,description,total,paid,due_date) values(p_customer,v_id,p_item,v_total,p_paid,p_due); end if;
 select name into v_name from customers where id=p_customer;
 insert into activity_logs(action,customer_name,amount,user_name) values(case when v_type='cash' then 'بيع نقدي' else 'بيع بالدين' end,v_name,v_total,'المحل');
 insert into notifications(kind,message) values('sale','عملية بيع بقيمة '||v_total||' د.ع '||coalesce('— '||v_name,''));
 return v_id;
end $$;

create or replace function add_payment(p_debt uuid,p_amount bigint,p_method text,p_note text,p_key uuid) returns void language plpgsql security definer set search_path=public as $$
declare d debts%rowtype; v_name text;
begin
 if exists(select 1 from payments where client_key=p_key) then return; end if;
 select * into d from debts where id=p_debt for update;
 if not found then raise exception 'الدين غير موجود'; end if;
 if p_amount<=0 or p_amount>d.total-d.paid then raise exception 'المبلغ أكبر من المتبقي أو غير صحيح'; end if;
 insert into payments(client_key,debt_id,customer_id,amount,method,note) values(p_key,p_debt,d.customer_id,p_amount,p_method,p_note);
 update debts set paid=paid+p_amount where id=p_debt;
 select name into v_name from customers where id=d.customer_id;
 insert into activity_logs(action,customer_name,amount,user_name) values('تسديد دين',v_name,p_amount,'المحل');
 insert into notifications(kind,message) values('payment',case when d.paid+p_amount=d.total then 'اكتمل تسديد دين '||v_name else 'تسديد '||p_amount||' د.ع من '||v_name end);
end $$;
revoke all on function create_sale,add_payment from public;
grant execute on function create_sale,add_payment to anon,authenticated;

-- Realtime
do $$ declare t text; begin foreach t in array array['customers','sales','debts','payments','expenses','notifications','activity_logs'] loop
 begin execute format('alter publication supabase_realtime add table %I',t); exception when duplicate_object then null; end; end loop; end $$;
</script>
